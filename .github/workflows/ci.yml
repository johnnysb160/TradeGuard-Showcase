name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradeGuard.slnx

      - name: Build
        run: dotnet build TradeGuard.slnx --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test TradeGuard.slnx --configuration Release --no-build --nologo

      - name: Audit dependencies
        run: dotnet list TradeGuard.slnx package --vulnerable --include-transitive
